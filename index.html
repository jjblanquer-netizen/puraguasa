<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>PuraGuasa — En busca del Intruso</title>
<meta name="description" content="PuraGuasa: en busca del Intruso. Descubre quién no sabe la palabra secreta. Juego social multijugador, sin registro." />
<meta name="theme-color" content="#0B0F2B" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="css/styles.css?v=4" />
</head>
<body>
  <div id="app" class="app-shell">
    <div id="toast" class="toast" hidden></div>
    <main id="screen" class="screen"></main>
  </div>

  <script type="module" src="js/app.js?v=4"></script>
  <script>
    // Registra el service worker (para que la app funcione como PWA
    // instalable y siga la estrategia "red primero" de sw.js). Si alguna
    // vez ves contenido desactualizado, esto es lo que se encarga de
    // refrescarlo automáticamente en la siguiente visita.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
